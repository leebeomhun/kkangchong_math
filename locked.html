<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>깡충 수학</title>
<meta name="theme-color" content="#e3f3fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141c36" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
/* 보호자 비밀번호 화면: nginx가 열쇠(쿠키)가 없는 기기에 앱 대신 보여 주는 페이지. 외부 파일 없이 혼자 동작해야 함. */
:root{
  --sky:#e3f3fb; --sky-deep:#c4e6f5; --grass:#9fd68d; --grass-deep:#72bb72;
  --panel:#ffffff; --panel-line:#d2e4ee; --field:#f3f9fc;
  --ink:#2b3a4c; --ink-soft:#5f7084;
  --carrot:#ef7424; --carrot-deep:#c4560f; --on-carrot:#ffffff;
  --plum:#8a63ec; --plum-soft:#ece5ff; --berry:#c63a61; --leaf:#2f8049;
  --focus:#1f6fd1;
  --font-ko:"Jua","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --font-body:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky:#141c36; --sky-deep:#1f2b52; --grass:#2d6146; --grass-deep:#224c37;
    --panel:#232d52; --panel-line:#34406f; --field:#1b2446;
    --ink:#f2f4ff; --ink-soft:#b6bfdc;
    --carrot:#f07a2c; --carrot-deep:#b2500e;
    --plum:#9b7aff; --plum-soft:#2f2a5c; --berry:#ff8aa8; --leaf:#6fd08f;
    --focus:#8fc1ff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --sky:#141c36; --sky-deep:#1f2b52; --grass:#2d6146; --grass-deep:#224c37;
  --panel:#232d52; --panel-line:#34406f; --field:#1b2446;
  --ink:#f2f4ff; --ink-soft:#b6bfdc;
  --carrot:#f07a2c; --carrot-deep:#b2500e;
  --plum:#9b7aff; --plum-soft:#2f2a5c; --berry:#ff8aa8; --leaf:#6fd08f;
  --focus:#8fc1ff;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  min-height:100dvh; display:flex; align-items:center; justify-content:center;
  padding:24px 16px calc(24px + env(safe-area-inset-bottom));
  background:linear-gradient(var(--sky) 0%, var(--sky-deep) 70%, var(--sky-deep) 100%);
  color:var(--ink); font-family:var(--font-body); word-break:keep-all;
  position:relative; overflow-x:hidden;
}
body::after{
  content:""; position:fixed; left:-10%; right:-10%; bottom:-60px; height:140px; z-index:0;
  background:var(--grass); border-radius:50% 50% 0 0; box-shadow:inset 0 10px 0 var(--grass-deep);
}
main{
  position:relative; z-index:1; width:100%; max-width:400px;
  background:var(--panel); border:2px solid var(--panel-line); border-radius:28px;
  padding:28px 24px 24px; text-align:center;
  box-shadow:0 6px 0 var(--panel-line);
}
.badge{
  width:72px; height:72px; margin:0 auto 12px; border-radius:24px;
  display:grid; place-items:center; background:var(--plum-soft); color:var(--plum);
}
h1{font-family:var(--font-ko); font-weight:400; font-size:32px; margin:0 0 4px; letter-spacing:.5px}
.sub{font-family:var(--font-ko); font-size:18px; color:var(--plum); margin:0 0 14px}
p.help{font-size:15px; line-height:1.6; color:var(--ink-soft); margin:0 0 20px}
form{display:flex; flex-direction:column; gap:12px}
label.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}
.field{position:relative}
input{
  width:100%; height:56px; padding:0 72px 0 18px; border-radius:16px;
  border:2px solid var(--panel-line); background:var(--field); color:var(--ink);
  font-size:20px; letter-spacing:1px; font-family:ui-monospace,"SF Mono",Menlo,monospace;
}
input::placeholder{color:var(--ink-soft); letter-spacing:0; font-family:var(--font-body); font-size:16px}
input:focus{outline:3px solid var(--focus); outline-offset:2px}
.peek{
  position:absolute; right:8px; top:8px; height:40px; padding:0 12px; border-radius:12px;
  border:0; background:transparent; color:var(--ink-soft); font:inherit; font-size:14px; cursor:pointer;
}
.peek:focus-visible{outline:3px solid var(--focus)}
button.go{
  height:60px; border:0; border-radius:18px; cursor:pointer;
  background:var(--carrot); color:var(--on-carrot); box-shadow:0 5px 0 var(--carrot-deep);
  font-family:var(--font-ko); font-size:24px; letter-spacing:1px;
}
button.go:active{transform:translateY(3px); box-shadow:0 2px 0 var(--carrot-deep)}
button.go:disabled{opacity:.6; cursor:wait}
button.go:focus-visible{outline:3px solid var(--focus); outline-offset:3px}
.msg{min-height:24px; margin:4px 0 0; font-size:15px; font-weight:600}
.msg.bad{color:var(--berry)}
.msg.ok{color:var(--leaf)}
</style>
</head>
<body>
<main>
  <div class="badge" aria-hidden="true">
    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10" rx="3"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/><circle cx="12" cy="15.5" r="1.2" fill="currentColor"/></svg>
  </div>
  <h1>깡충 수학</h1>
  <p class="sub">보호자 확인</p>
  <p class="help">보호자 비밀번호를 넣어 주세요.<br>이 기기에서 한 번만 넣으면 계속 기억해요.</p>
  <form id="f" autocomplete="on">
    <label class="sr" for="pw">보호자 비밀번호</label>
    <div class="field">
      <input id="pw" name="password" type="password" autocomplete="current-password"
             autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="비밀번호" required>
      <button class="peek" type="button" id="peek" aria-pressed="false">보기</button>
    </div>
    <button class="go" id="go" type="submit">들어가기</button>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
  </form>
</main>
<script>
(() => {
  const f = document.getElementById('f'), pw = document.getElementById('pw'),
        go = document.getElementById('go'), msg = document.getElementById('msg'),
        peek = document.getElementById('peek');
  const say = (text, cls) => { msg.textContent = text; msg.className = 'msg' + (cls ? ' ' + cls : ''); };

  peek.addEventListener('click', () => {
    const show = pw.type === 'password';
    pw.type = show ? 'text' : 'password';
    peek.textContent = show ? '숨기기' : '보기';
    peek.setAttribute('aria-pressed', String(show));
    pw.focus();
  });

  f.addEventListener('submit', async (e) => {
    e.preventDefault();
    // 띄어쓰기와 하이픈(-)은 빼고, 대문자는 소문자로 바꿔서 확인
    const key = pw.value.toLowerCase().replace(/[\s-]/g, '');
    if (!key) return;
    go.disabled = true;
    say('확인하고 있어요…');
    try {
      const r = await fetch('/unlock?key=' + encodeURIComponent(key) + '&t=' + Date.now(),
                            { cache: 'no-store', credentials: 'same-origin' });
      if (r.status === 204) {
        say('열렸어요!', 'ok');
        location.replace('/');
        return;
      }
      if (r.status === 429) say('너무 여러 번 틀렸어요. 1분 뒤에 다시 해 주세요.', 'bad');
      else say('비밀번호가 맞지 않아요.', 'bad');
      pw.select();
    } catch (err) {
      say('인터넷 연결을 확인해 주세요.', 'bad');
    }
    go.disabled = false;
  });

  pw.focus();
})();
</script>
</body>
</html>
